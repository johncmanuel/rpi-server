services:
  codered-tailscale:
    image: tailscale/tailscale:latest
    container_name: codered-tailscale
    hostname: codered
    env_file:
      - .env
    environment:
      - TS_AUTHKEY
      - TS_EXTRA_ARGS
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - codered_ts_state:/var/lib/tailscale
      - codered_ts_sock:/var/run/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./serve.json:/config/serve.json:ro
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  codered-caddy:
    image: caddy:2.11.4-alpine
    container_name: codered-caddy
    restart: unless-stopped
    network_mode: service:codered-tailscale
    depends_on:
      - codered-tailscale
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  codered-server:
    image: ghcr.io/johncmanuel/codered:latest
    restart: unless-stopped
    container_name: codered-server

volumes:
  codered_ts_state:
  codered_ts_sock:
